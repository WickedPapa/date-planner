<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scegli la Data</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <h1 id="step3Title"></h1>
    <input type="date" id="datePicker">
    <p id="heartNote" style="font-size:0.85rem; color:#e84118; margin-top:5px;"></p>
    <div style="margin-top: 20px;">
      <button class="btn-secondary" onclick="window.location.href='step2-quest.html'" id="btnBack"></button>
      <button onclick="saveDate()" id="btnNext"></button>
    </div>
  </div>

  <!-- IMPORT DEGLI SCRIPT CONDIVISI -->
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="utils.js"></script>

  <script>
    if (!localStorage.getItem('auth')) window.location.href = 'index.html';

    document.getElementById('step3Title').innerText = getText('step3Title');
    document.getElementById('btnBack').innerText = getText('btnBack');
    document.getElementById('btnNext').innerText = getText('btnNext');

    const picker = document.getElementById('datePicker');

    // Calcola la data di DOMANI in formato YYYY-MM-DD usando il fuso locale
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);

    const year = tomorrow.getFullYear();
    const month = String(tomorrow.getMonth() + 1).padStart(2, '0');
    const day = String(tomorrow.getDate()).padStart(2, '0');

    const tomorrowFormatted = `${year}-${month}-${day}`;

    // 1. Blocca i giorni precedenti a domani
    picker.setAttribute('min', tomorrowFormatted);

    // 2. Preseleziona domani come default se non c'è già una data salvata valida
    const savedDate = localStorage.getItem('selectedDate');
    if (savedDate && savedDate >= tomorrowFormatted) {
      picker.value = savedDate;
    } else {
      picker.value = tomorrowFormatted;
    }

    // Funzione per controllare le date speciali
    function checkHeartNote(dateVal) {
      if (CONFIG.highlightedDates && CONFIG.highlightedDates.includes(dateVal)) {
        document.getElementById('heartNote').innerText = "Data speciale scelta! ❤️";
      } else {
        document.getElementById('heartNote').innerText = "";
      }
    }

    // Esegui il controllo subito all'apertura per il valore di default
    checkHeartNote(picker.value);

    // Aggiorna la nota ad ogni cambio manuale
    picker.addEventListener('change', () => {
      checkHeartNote(picker.value);
    });

    function saveDate() {
      if (!picker.value) {
        alert("Seleziona una data per proseguire!");
        return;
      }
      localStorage.setItem('selectedDate', picker.value);
      window.location.href = 'step4-time.html';
    }
  </script>
</body>
</html>
