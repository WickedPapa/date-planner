<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confermato!</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <h1 id="successTitle"></h1>
    <p id="successMsg" style="font-size:1.2rem; font-weight:bold; color:#ff4757;"></p>
    <p id="foodChosen" style="font-size:1rem; color:#555;"></p>
  </div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="utils.js"></script>
  <script>
    if (!localStorage.getItem('auth')) window.location.href = 'index.html';

    const rawDate = localStorage.getItem('selectedDate') || '';
    const date = formatDate(rawDate);
    
    const time = localStorage.getItem('selectedTime') || '';
    
    const rawFood = localStorage.getItem('selectedFood') || '';
    const food = rawFood.toLowerCase();

    document.getElementById('successTitle').innerText = getText('successTitle');
    document.getElementById('successMsg').innerText = getText('successMsg', { date, time });
    document.getElementById('foodChosen').innerText = getText('foodChosen', { food });
  </script>
</body>
</html>
