<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confermato!</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="heart-bg"><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span></div>
  <div class="card">
    <h1 id="step6Title"></h1>
    <p id="successMsg" style="font-size:1.2rem; font-weight:bold; color:#ff4757;"></p>
  </div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="utils.js"></script>
  <script>
    if (!localStorage.getItem('auth')) window.location.href = 'index.html';

    const rawDate = localStorage.getItem('selectedDate') || '';
    const date = formatDate(rawDate);
    
    const time = localStorage.getItem('selectedTime') || '';
    
    document.getElementById('step6Title').innerText = getText('step6Title');
    document.getElementById('successMsg').innerText = getText('successMsg', { date, time });
  </script>
</body>
</html>
