<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scegli il Cibo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="heart-bg"><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span></div>
  <div class="card">
    <h1 id="foodTitle"></h1>
    
    <div class="food-grid">
      <div class="food-card" data-food-key="foodPasta" onclick="selectFoodCard(this, getText('foodPasta'))">
        <img src="https://img.icons8.com/emoji/96/spaghetti-emoji.png" alt="">
        <span></span>
      </div>
      <div class="food-card" data-food-key="foodMeat" onclick="selectFoodCard(this, getText('foodMeat'))">
        <img src="https://img.icons8.com/emoji/96/cut-of-meat-emoji.png" alt="">
        <span></span>
      </div>
      <div class="food-card" data-food-key="foodFish" onclick="selectFoodCard(this, getText('foodFish'))">
        <img src="https://img.icons8.com/emoji/96/fish-emoji.png" alt="">
        <span></span>
      </div>
      <div class="food-card" data-food-key="foodBurger" onclick="selectFoodCard(this, getText('foodBurger'))">
        <img src="https://img.icons8.com/emoji/96/hamburger-emoji.png" alt="">
        <span></span>
      </div>
      <div class="food-card" data-food-key="foodSushi" onclick="selectFoodCard(this, getText('foodSushi'))">
        <img src="https://img.icons8.com/emoji/96/sushi-emoji.png" alt="">
        <span></span>
      </div>
      <div class="food-card" data-food-key="foodRamen" onclick="selectFoodCard(this, getText('foodRamen'))">
        <img src="https://img.icons8.com/emoji/96/steaming-bowl-emoji.png" alt="">
        <span></span>
      </div>
      <div class="food-card" data-food-key="foodSandwich" onclick="selectFoodCard(this, getText('foodSandwich'))">
        <img src="https://img.icons8.com/emoji/96/sandwich-emoji.png" alt="">
        <span></span>
      </div>
      <div class="food-card" data-food-key="foodPizza" onclick="selectFoodCard(this, getText('foodPizza'))">
        <img src="https://img.icons8.com/emoji/96/pizza-emoji.png" alt="">
        <span></span>
      </div>
      <div class="food-card" data-food-key="foodOther" onclick="selectFoodCard(this, getText('foodOther'))">
        <img src="https://img.icons8.com/emoji/48/hot-pepper.png" alt="">
        <span></span>
      </div>
    </div>

    <div>
      <button class="btn-secondary" onclick="window.location.href='datetime.html'" id="btnBack"></button>
      <button onclick="goNext()" id="btnNext"></button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="utils.js"></script>
  <script>
    if (!localStorage.getItem('auth')) window.location.href = 'index.html';

    document.getElementById('foodTitle').innerText = getText('foodTitle');
    document.getElementById('btnBack').innerText = getText('btnBack');
    document.getElementById('btnNext').innerText = getText('btnNext');

    document.querySelectorAll('.food-card').forEach(card => {
      const foodName = getText(card.dataset.foodKey);
      card.querySelector('img').alt = foodName;
      card.querySelector('span').innerText = foodName;
    });

    let currentChoice = localStorage.getItem('selectedFood') || '';

    // Restore any previous selection
    if (currentChoice) {
      const cards = document.querySelectorAll('.food-card');
      cards.forEach(card => {
        if (card.querySelector('span').innerText === currentChoice) {
          card.classList.add('selected');
        }
      });
    }

    function selectFoodCard(element, foodChoice) {
      document.querySelectorAll('.food-card').forEach(card => card.classList.remove('selected'));
      element.classList.add('selected');
      currentChoice = foodChoice;
      localStorage.setItem('selectedFood', foodChoice);
    }

    function goNext() {
      if (!currentChoice) {
        alert(getText('invalidFoodMessage'));
        return;
      }
      window.location.href = 'notes.html';
    }
  </script>
</body>
</html>
