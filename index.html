<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="heart-bg"><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span></div>
  <div class="card">
    <h1 id="welcomeTitle"></h1>
    <p id="enterPass"></p>
    <input type="password" id="passwordInput">
    <p id="passHint" style="font-size:0.85rem; color:#888; margin-bottom:10px;"></p>
    <p id="passError" style="color:#e84118; font-size:0.85rem; min-height:1.2em;"></p>
    <button onclick="checkPassword()" id="btnSubmit"></button>
  </div>

  <!-- Shared scripts -->
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="utils.js"></script>

  <script>
    document.getElementById('welcomeTitle').innerText = getText('welcomeTitle');
    document.getElementById('enterPass').innerText = getText('enterPass');
    document.getElementById('passHint').innerText = getText('passHint');
    document.getElementById('btnSubmit').innerText = getText('btnSubmit');

    async function checkPassword() {
      const input = document.getElementById('passwordInput').value;
      const hash = await sha256(input);
      if (hash === CONFIG.passwordHashSHA256) {
        localStorage.setItem('auth', 'true');
        window.location.href = 'quest.html';
      } else {
        document.getElementById('passError').innerText = getText('passError');
      }
    }

    document.getElementById('passwordInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkPassword();
    });
  </script>
</body>
</html>
