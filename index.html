<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prenotazione Appuntamento</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <h1 id="welcomeTitle"></h1>
    <p id="enterPass"></p>
    <input type="password" id="passInput" placeholder="Password...">
    <p id="passHint" style="font-size:0.85rem; color:#888; font-style:italic; margin-bottom:15px;"></p>
    <button id="btnSubmit" onclick="checkPassword()"></button>
    <div id="errorBox" class="error-msg"></div>
  </div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="utils.js"></script>
  <script>
    document.getElementById('welcomeTitle').innerText = getText('welcomeTitle');
    document.getElementById('enterPass').innerText = getText('enterPass');
    document.getElementById('passHint').innerText = getText('passHint');
    document.getElementById('btnSubmit').innerText = getText('btnSubmit');

    async function checkPassword() {
      const input = document.getElementById('passInput').value;
      const hashedInput = await sha256(input);
      
      if (hashedInput === CONFIG.passwordHashSHA256) {
        localStorage.setItem('auth', 'true');
        window.location.href = 'step2-quest.html';
      } else {
        document.getElementById('errorBox').innerText = getText('passError');
      }
    }
  </script>
</body>
</html>
