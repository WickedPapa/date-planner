<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vuoi uscire con me?</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 30px;
      min-height: 160px;
      position: relative;
      width: 100%;
    }

    .btn-yes {
      background-color: #2ed573;
      position: relative !important;
      z-index: 2;
    }

    .btn-no {
      background-color: #ff4757;
      position: relative !important;
      top: auto !important;
      left: auto !important;
      z-index: 10;
      transition: all 0.15s ease-out;
    }
  </style>
</head>
<body>
  <div class="card" id="cardBox">
    <h1 id="questTitle"></h1>
    
    <div class="btn-container">
      <button id="btnYes" class="btn-yes" onclick="goNext()"></button>
      <button id="btnNo" class="btn-no"></button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="utils.js"></script>
  <script>
    if (!localStorage.getItem('auth')) window.location.href = 'index.html';

    document.getElementById('questTitle').innerText = getText('step2Title');
    document.getElementById('btnYes').innerText = getText('btnYes');
    
    const btnNo = document.getElementById('btnNo');
    const card = document.getElementById('cardBox');
    btnNo.innerText = getText('btnNo');

    function moveNoButton(e) {
      if (e) e.preventDefault();

      // Passa a position absolute dentro la card soltanto al primo tocco/hover
      if (btnNo.style.position !== 'absolute') {
        btnNo.style.position = 'absolute';
      }

      const cardRect = card.getBoundingClientRect();
      const btnRect = btnNo.getBoundingClientRect();

      // Mantiene il bottone nei limiti interni della scheda
      const padding = 15;
      const maxX = cardRect.width - btnRect.width - padding;
      const maxY = cardRect.height - btnRect.height - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      btnNo.style.left = randomX + 'px';
      btnNo.style.top = randomY + 'px';
    }

    btnNo.addEventListener('mouseover', moveNoButton);
    btnNo.addEventListener('touchstart', moveNoButton, { passive: false });
    btnNo.addEventListener('click', moveNoButton);

    function goNext() {
      window.location.href = 'step3-date.html';
    }
  </script>
</body>
</html>
