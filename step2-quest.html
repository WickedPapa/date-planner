<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vuoi uscire con me?</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 30px;
      min-height: 180px;
      position: relative;
      width: 100%;
    }

    .btn-yes {
      background-color: #2ed573;
      z-index: 2;
    }

    .btn-no {
      background-color: #ff4757;
      z-index: 10;
      transition: top 0.15s ease-out, left 0.15s ease-out;
    }
  </style>
</head>
<body>
  <div class="card" id="cardBox">
    <h1 id="questTitle"></h1>
    
    <div class="btn-container">
      <button id="btnYes" class="btn-yes" onclick="goNext()"></button>
      <button id="btnNo" class="btn-no"></button>
    </div>
  </div>

  <!-- IMPORT DEGLI SCRIPT CONDIVISI -->
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="utils.js"></script>

  <script>
    if (!localStorage.getItem('auth')) window.location.href = 'index.html';

    document.getElementById('questTitle').innerText = getText('step2Title');
    document.getElementById('btnYes').innerText = getText('btnYes');
    
    const btnNo = document.getElementById('btnNo');
    const card = document.getElementById('cardBox');
    btnNo.innerText = getText('btnNo');

    function moveNoButton(e) {
      if (e) e.preventDefault();

      const cardRect = card.getBoundingClientRect();
      const btnRect = btnNo.getBoundingClientRect();

      // Al primo tocco o hover, convertiamo la posizione attuale in absolute rispetto alla card
      if (btnNo.style.position !== 'absolute') {
        const initialLeft = btnRect.left - cardRect.left;
        const initialTop = btnRect.top - cardRect.top;
        
        btnNo.style.position = 'absolute';
        btnNo.style.left = initialLeft + 'px';
        btnNo.style.top = initialTop + 'px';
      }

      // Calcoliamo la nuova posizione casuale rimanendo nei margini della card
      const padding = 20;
      const maxX = cardRect.width - btnRect.width - padding;
      const maxY = cardRect.height - btnRect.height - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      btnNo.style.left = randomX + 'px';
      btnNo.style.top = randomY + 'px';
    }

    btnNo.addEventListener('mouseover', moveNoButton);
    btnNo.addEventListener('touchstart', moveNoButton, { passive: false });
    btnNo.addEventListener('click', moveNoButton);

    function goNext() {
      window.location.href = 'step3-date.html';
    }
  </script>
</body>
</html>
