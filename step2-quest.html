<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vuoi uscire con me?</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Button playground: relative so absolute children are positioned inside it */
    .btn-container {
      position: relative;
      width: 100%;
      min-height: 120px;
      margin-top: 30px;
    }

    /* Initial centered layout */
    .btn-flex-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      width: 100%;
      height: 100%;
    }

    .btn-yes {
      background-color: #2ed573;
      z-index: 2;
    }

    .btn-no {
      background-color: #ff4757;
      z-index: 10;
      transition: top 0.15s ease-out, left 0.15s ease-out;
    }

    /* Once escaped, btn-no is positioned absolutely inside .btn-container */
    .btn-no.escaped {
      position: absolute;
    }
  </style>
</head>
<body>
  <div class="card" id="cardBox">
    <h1 id="questTitle"></h1>

    <div class="btn-container" id="btnContainer">
      <div class="btn-flex-row">
        <button id="btnYes" class="btn-yes" onclick="goNext()"></button>
        <button id="btnNo" class="btn-no"></button>
      </div>
    </div>
  </div>

  <!-- Shared scripts -->
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="utils.js"></script>

  <script>
    if (!localStorage.getItem('auth')) window.location.href = 'index.html';

    document.getElementById('questTitle').innerText = getText('step2Title');
    document.getElementById('btnYes').innerText = getText('btnYes');

    const btnNo = document.getElementById('btnNo');
    const container = document.getElementById('btnContainer');
    btnNo.innerText = getText('btnNo');

    function moveNoButton(e) {
      e.preventDefault();
      e.stopPropagation();

      const containerRect = container.getBoundingClientRect();
      const btnRect = btnNo.getBoundingClientRect();
      const padding = 10;

      // On first escape: anchor it absolutely at its current visual position
      if (!btnNo.classList.contains('escaped')) {
        const initialLeft = btnRect.left - containerRect.left;
        const initialTop = btnRect.top - containerRect.top;
        btnNo.classList.add('escaped');
        btnNo.style.left = initialLeft + 'px';
        btnNo.style.top = initialTop + 'px';
      }

      // Compute a random new position fully inside the container
      const maxX = containerRect.width - btnRect.width - padding;
      const maxY = containerRect.height - btnRect.height - padding;

      let randomX, randomY;
      do {
        randomX = Math.floor(Math.random() * Math.max(maxX, padding));
        randomY = Math.floor(Math.random() * Math.max(maxY, padding));
      } while (
        Math.abs(randomX - parseFloat(btnNo.style.left)) < 30 &&
        Math.abs(randomY - parseFloat(btnNo.style.top)) < 30
      );

      btnNo.style.left = randomX + 'px';
      btnNo.style.top = randomY + 'px';

      // Grow the container if the button needs more vertical space
      const neededHeight = randomY + btnRect.height + padding;
      if (neededHeight > container.offsetHeight) {
        container.style.minHeight = neededHeight + 'px';
      }
    }

    btnNo.addEventListener('mouseover', moveNoButton);
    btnNo.addEventListener('touchstart', moveNoButton, { passive: false });
    btnNo.addEventListener('click', moveNoButton);

    function goNext() {
      window.location.href = 'step3-date.html';
    }
  </script>
</body>
</html>
