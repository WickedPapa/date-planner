<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vuoi uscire con me?</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Fixed-size playground — buttons are absolutely placed inside */
    .btn-container {
      position: relative;
      width: 100%;
      height: 160px;
      margin-top: 30px;
      overflow: visible;
    }

    .btn-yes,
    .btn-no {
      position: absolute;
    }

    .btn-yes {
      background-color: #2ed573;
      z-index: 2;
    }

    .btn-no {
      background-color: #ff4757;
      z-index: 10;
      transition: top 0.15s ease-out, left 0.15s ease-out;
    }
  </style>
</head>
<body>
  <div class="heart-bg"><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span><span>❤️</span><span>🩷</span></div>
  <div class="card" id="cardBox">
    <h1 id="step1Title"></h1>

    <div class="btn-container" id="btnContainer">
      <button id="btnYes" class="btn-yes" onclick="goNext()"></button>
      <button id="btnNo" class="btn-no"></button>
    </div>
  </div>

  <!-- Shared scripts -->
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="utils.js"></script>

  <script>
    if (!localStorage.getItem('auth')) window.location.href = 'index.html';

    document.getElementById('step1Title').innerText = getText('step1Title');

    const btnYes = document.getElementById('btnYes');
    const btnNo = document.getElementById('btnNo');
    const container = document.getElementById('btnContainer');

    btnYes.innerText = getText('btnYes');
    btnNo.innerText = getText('btnNo');

    // After the DOM is rendered, position both buttons centered side by side
    function initButtonPositions() {
      const cW = container.offsetWidth;
      const cH = container.offsetHeight;
      const yW = btnYes.offsetWidth;
      const yH = btnYes.offsetHeight;
      const nW = btnNo.offsetWidth;
      const nH = btnNo.offsetHeight;
      const gap = 20;
      const totalW = yW + gap + nW;

      const startX = (cW - totalW) / 2;
      const centerY = (cH - Math.max(yH, nH)) / 2;

      btnYes.style.left = startX + 'px';
      btnYes.style.top = centerY + 'px';

      btnNo.style.left = (startX + yW + gap) + 'px';
      btnNo.style.top = ((cH - nH) / 2) + 'px';
    }

    // Run after layout is stable
    requestAnimationFrame(() => requestAnimationFrame(initButtonPositions));

    function moveNoButton(e) {
      e.preventDefault();
      e.stopPropagation();

      const cW = container.offsetWidth;
      const cH = container.offsetHeight;
      const nW = btnNo.offsetWidth;
      const nH = btnNo.offsetHeight;
      const padding = 10;

      const currentLeft = parseFloat(btnNo.style.left) || 0;
      const currentTop = parseFloat(btnNo.style.top) || 0;

      const maxX = cW - nW - padding;
      const maxY = cH - nH - padding;

      // Pick a position far enough from the current one so it visibly moves
      let newX, newY, attempts = 0;
      do {
        newX = Math.floor(Math.random() * Math.max(maxX, 0)) + padding;
        newY = Math.floor(Math.random() * Math.max(maxY, 0)) + padding;
        attempts++;
      } while (
        attempts < 20 &&
        Math.abs(newX - currentLeft) < 40 &&
        Math.abs(newY - currentTop) < 40
      );

      btnNo.style.left = newX + 'px';
      btnNo.style.top = newY + 'px';
    }

    btnNo.addEventListener('mouseover', moveNoButton);
    btnNo.addEventListener('touchstart', moveNoButton, { passive: false });
    btnNo.addEventListener('click', moveNoButton);

    function goNext() {
      window.location.href = 'step2-datetime.html';
    }
  </script>
</body>
</html>
